<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ein Tag im Leben der Tiere · A Day in an Animal's Life</title>
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="style.css">
<script>
  // Sprache wählen: zuerst die eigene Wahl (Sprachlink auf den Seiten), sonst die Browsersprache.
  (function () {
    var wahl = null;
    try { wahl = localStorage.getItem("sprache"); } catch (e) {}
    if (wahl !== "de" && wahl !== "en") {
      var liste = navigator.languages || [navigator.language || ""];
      wahl = "en";
      for (var i = 0; i < liste.length; i++) {
        var s = String(liste[i]).toLowerCase();
        if (s.indexOf("de") === 0) { wahl = "de"; break; }
        if (s.indexOf("en") === 0) { break; }
      }
    }
    location.replace(wahl + "/");
  })();
</script>
</head>
<body>
<div class="wahl">
  <p><img src="img/fuchs.jpg" alt="" width="128" height="128" style="border-radius:50%"></p>
  <a class="knopf" href="de/">Deutsch</a>
  <a class="knopf" href="en/">English</a>
</div>
</body>
</html>
